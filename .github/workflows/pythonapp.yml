name: logni.py

on:
  push:
    branches:
    - master
    - develop
    - feature/*

jobs:
  build:

    runs-on: ubuntu-18.04
    strategy:
      matrix:
        python: [ '3.7', '3.8' ]

    env:
      PYTHONPATH: $PYTHONPATH:/usr/lib/python3/dist-packages/:/usr/local/lib/python3/dist-packages:$PWD:/home/runner/work/logni.py/logni.py

    steps:
    - uses: actions/checkout@v1
    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python }}

    - name: Install dependencies [system]
      run: |
        sudo apt-get install python3 python3-pip pylint3 -y

    - name: Install dependencies [python]
      run: |
        sudo pip3 install -r requirements.txt

    - name: Code analysis with Pylint
      run: |
        chmod 755 test/example/*.sh
        ./test/example/pylint.sh

    - name: import logni
      run: python3 -c "import logni; print(dir(logni))"

    - name: from logni import log
      run: python3 -c "from logni import log; log.info('aaa')"

    - name: Tests with pytest
      run: |
        sudo apt-get install python3-pytest
        pytest-3 -v test/unit/*.py

    - name: Run example
      run: python3 test/example/basic_example.py
